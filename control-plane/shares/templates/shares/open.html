<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Shared with you · Clavium</title>
<style nonce="{{ nonce }}">
  :root { --bg:#060E1C; --card:#102244; --raised:#16305C; --border:rgba(154,182,224,.16); --text:#E9EDF5; --dim:#9FB0C9;
          --blue:#3D74C4; --gold:#C9A227; --danger:#D9534F; --ok:#3FAE6B; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:32px 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; width:100%; max-width:480px; }
  .brand { font-weight:700; font-size:18px; margin-bottom:16px; } .brand span { color:var(--gold); }
  h1 { font-size:20px; margin:0 0 6px; word-break: break-word; }
  p { color:var(--dim); margin:0 0 14px; }
  .muted { color:var(--dim); font-size:13px; }
  input { width:100%; background:#0A1730; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:11px; font:inherit; margin-bottom:12px; }
  button { background:var(--raised); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font:inherit; cursor:pointer; }
  button.primary { width:100%; background:var(--blue); border-color:var(--blue); font-weight:600; padding:12px; }
  button:disabled { opacity:.6; cursor:default; }
  .field { border-top:1px solid var(--border); padding:12px 0; }
  .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
  .row { display:flex; gap:8px; align-items:center; }
  .value { flex:1; min-width:0; word-break:break-all; white-space:pre-wrap; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .error { color:#ffb3b1; background:rgba(217,83,79,.15); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .note { background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.4); border-radius:8px; padding:10px 12px; margin:12px 0 0; color:var(--text); font-size:13px; }
  .hidden { display:none; }
  footer { margin-top:18px; font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">Clavi<span>um</span></div>
  <div id="state"><p>Checking the link…</p></div>
  <div id="ask" class="hidden">
    <h1>Someone shared something with you</h1>
    <p id="meta"></p>
    <div id="passbox" class="hidden">
      <p>The sender protected this with a passphrase. They should have told you it another way, for example by phone.</p>
      <input id="pass" type="password" autocomplete="off" placeholder="Passphrase">
    </div>
    <div id="err" class="error hidden"></div>
    <button id="reveal" class="primary">Show it</button>
    <p class="muted" id="warn"></p>
  </div>
  <div id="result" class="hidden"></div>
  <footer>Shared with Clavium. It was encrypted on the sender's device and only this link can open it: not even Clavium can read it.</footer>
</main>
<script nonce="{{ nonce }}">
(() => {
  const ID = "{{ share_id }}";
  const API = "/api/shares/" + ID;
  const enc = new TextEncoder();
  const $ = (id) => document.getElementById(id);
  const key = location.hash.slice(1);

  function b64(s) { return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }
  function b64url(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return b64(s); }
  function toB64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function show(el, on) { el.classList.toggle("hidden", !on); }
  function stateText(title, text) {
    const s = $("state"); s.replaceChildren();
    const h = document.createElement("h1"); h.textContent = title; s.appendChild(h);
    const p = document.createElement("p"); p.textContent = text; s.appendChild(p);
  }

  async function derive(linkKey, pass, salt, rounds) {
    let ikm = linkKey;
    if (salt && pass) {
      const pk = await crypto.subtle.importKey("raw", enc.encode(pass.trim()), "PBKDF2", false, ["deriveBits"]);
      const stretched = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(salt), iterations: rounds }, pk, 256));
      ikm = new Uint8Array(linkKey.length + 32); ikm.set(linkKey); ikm.set(stretched, linkKey.length);
    }
    const hk = await crypto.subtle.importKey("raw", ikm, "HKDF", false, ["deriveBits"]);
    const bits = (info) => crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: enc.encode("clavium-share-v1"), info: enc.encode(info) }, hk, 256);
    return { encKey: await bits("enc"), auth: await bits("auth") };
  }

  const LABELS = { number: "Card number", expiry: "Expiry", cvv: "Security code", cardholder: "Name on card", pin: "PIN",
    account_number: "Account number", bank_name: "Bank", branch: "Branch", swift: "SWIFT", ssid: "Network name", security: "Security",
    hostname: "Host", port: "Port", database: "Database", license_key: "Licence key", api_key: "API key", private_key: "Private key" };
  const SECRET = new Set(["password", "cvv", "pin", "api_key", "private_key", "license_key", "totp_secret"]);
  const label = (k) => LABELS[k] || k.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());

  function field(name, value, secret) {
    const box = document.createElement("div"); box.className = "field";
    const l = document.createElement("div"); l.className = "label"; l.textContent = name; box.appendChild(l);
    const row = document.createElement("div"); row.className = "row";
    const v = document.createElement("div"); v.className = "value" + (secret ? " mono" : "");
    const dots = "•".repeat(Math.min(Math.max(value.length, 8), 16));
    v.textContent = secret ? dots : value; row.appendChild(v);
    if (secret) {
      const t = document.createElement("button"); t.textContent = "Show";
      t.onclick = () => { const on = t.textContent === "Show"; v.textContent = on ? value : dots; t.textContent = on ? "Hide" : "Show"; };
      row.appendChild(t);
    }
    const c = document.createElement("button"); c.textContent = "Copy";
    c.onclick = async () => { try { await navigator.clipboard.writeText(value); c.textContent = "Copied"; setTimeout(() => (c.textContent = "Copy"), 1500); } catch { c.textContent = "Select and copy"; } };
    row.appendChild(c); box.appendChild(row); return box;
  }

  function render(item, viewsLeft) {
    const r = $("result"); r.replaceChildren();
    const h = document.createElement("h1"); h.textContent = item.title || "Shared item"; r.appendChild(h);
    const add = (n, v, s) => { if (v) r.appendChild(field(n, String(v), s)); };
    add("Username", item.username); add("Password", item.password, true); add("Website", item.url);
    for (const f of item.fields || []) add(label(f.name), f.value, SECRET.has(f.name));
    for (const f of item.custom_fields || []) add(f.name, f.value, !!f.hidden);
    add("Authenticator secret", item.totp_secret, true); add("Notes", item.notes);
    const n = document.createElement("div"); n.className = "note";
    n.textContent = viewsLeft > 0 ? `This link can be opened ${viewsLeft} more time${viewsLeft === 1 ? "" : "s"}. Save what you need somewhere safe.`
      : "This link has now been used up and the server has deleted it. Save what you need before closing this page.";
    r.appendChild(n); show($("ask"), false); show(r, true);
  }

  async function start() {
    if (!key) return stateText("This link is incomplete", "Copy the whole link, including the part after #, and open it again.");
    if (!window.crypto || !crypto.subtle) return stateText("Use a newer browser", "This page needs a current browser to decrypt the shared item.");
    const res = await fetch(API + "/meta/", { cache: "no-store" });
    const meta = await res.json().catch(() => ({}));
    if (!res.ok) return stateText("This link no longer works", meta.detail || "It may have expired or been used already.");
    show($("state"), false); show($("ask"), true); show($("passbox"), meta.has_passphrase);
    const when = new Date(meta.expires_at);
    $("meta").textContent = `It can be opened ${meta.views_left} more time${meta.views_left === 1 ? "" : "s"} and expires ${when.toLocaleString()}.`;
    $("warn").textContent = meta.views_left === 1 ? "Opening it uses it up: only open it when you are ready to save it." : "";
    $("reveal").onclick = async () => {
      const btn = $("reveal"); btn.disabled = true; btn.textContent = "Decrypting…"; show($("err"), false);
      try {
        if (meta.has_passphrase && !$("pass").value.trim()) throw new Error("Enter the passphrase the sender gave you.");
        const { encKey, auth } = await derive(b64url(key), $("pass").value, meta.salt, meta.rounds);
        const r = await fetch(API + "/open/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ auth: toB64url(auth) }), cache: "no-store" });
        const body = await r.json().catch(() => ({}));
        if (r.status === 410) { show($("ask"), false); show($("state"), true); return stateText("This link no longer works", body.detail); }
        if (!r.ok) throw new Error(body.detail || "Could not open the link.");
        const k = await crypto.subtle.importKey("raw", encKey, "AES-GCM", false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(body.nonce), additionalData: enc.encode("clavium-share-v1|" + ID) }, k, b64(body.ciphertext));
        history.replaceState(null, "", location.pathname); // keep the key out of history
        render(JSON.parse(new TextDecoder().decode(plain)), body.views_left);
      } catch (e) {
        $("err").textContent = e.message || String(e); show($("err"), true);
        btn.disabled = false; btn.textContent = "Show it";
      }
    };
  }
  start().catch((e) => stateText("Something went wrong", String(e)));
})();
</script>
</body>
</html>
