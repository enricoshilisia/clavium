[package]
name = "clavium-api"
version = "0.1.0"
edition = "2021"
description = "One JSON command surface over clavium-security-core, shared by the Flutter app (via clavium-ffi) and the PWA (via clavium-wasm). Holds the unlocked vault; never does I/O."
license = "PROPRIETARY"

[dependencies]
clavium-security-core = { path = "../../security-core" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
zeroize = "1.8.1"
