name: Build mobile (Android) and web app

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - "bindings/**"
      - "security-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (core + JSON API)
        run: cargo test -p clavium-security-core -p clavium-api
      - name: Build the native core for the test host
        run: cargo build -p clavium-ffi --release
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze and test (over the real Rust core)
        working-directory: mobile
        env:
          CLAVIUM_FFI_PATH: ${{ github.workspace }}/target/release/libclavium_ffi.so
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.CLAVIUM_ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the native core for every Android ABI
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 24
          -o mobile/android/app/src/main/jniLibs
          build -p clavium-ffi --release
      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
      - name: Build APK and App Bundle
        working-directory: mobile
        env:
          CLAVIUM_KEYSTORE: ${{ runner.temp }}/release.jks
          CLAVIUM_KEYSTORE_PASSWORD: ${{ secrets.CLAVIUM_ANDROID_KEYSTORE_PASSWORD }}
          CLAVIUM_KEY_ALIAS: ${{ secrets.CLAVIUM_ANDROID_KEY_ALIAS }}
          CLAVIUM_KEY_PASSWORD: ${{ secrets.CLAVIUM_ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - name: Check the native core is inside the APK
        run: unzip -l mobile/build/app/outputs/flutter-apk/app-release.apk | grep libclavium_ffi.so
      - uses: actions/upload-artifact@v4
        with:
          name: clavium-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
      # Same idea as desktop-latest: a release asset is a plain public link
      # with no login and no expiry. The APK here is signed with a CI key
      # unless release-signing secrets are configured; the download page
      # serves a copy re-signed with the Clavium release key.
      - name: Publish (or update) the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Clavium for Android, latest build
          body: |
            Automatically built from master (commit ${{ github.sha }}).
            Install: open the APK on your phone and allow installs from this source.
          prerelease: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install wasm-bindgen (version pinned by Cargo.lock)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: Build the PWA
        working-directory: mobile
        run: |
          flutter pub get
          ./tool/build_web.sh
          cd build/web && zip -qr ../../clavium-web.zip .
      - name: Publish (or update) the web-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: Clavium web app (PWA), latest build
          body: Static files for self-hosting the Clavium web app. Serve over HTTPS.
          prerelease: true
          files: mobile/clavium-web.zip
