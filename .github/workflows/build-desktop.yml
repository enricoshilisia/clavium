name: Build desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "desktop/**"
      - "security-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the Tauri app
        working-directory: desktop
        run: npm run tauri -- build

      - name: Show where the bundle actually landed
        if: always()
        run: Get-ChildItem -Recurse -Include *.msi,*.exe -Path . -ErrorAction SilentlyContinue | Select-Object FullName

      # Cargo workspace builds land in the workspace root's target/, not
      # desktop/src-tauri/target/. A previous run found neither path
      # because a committed .cargo/config.toml hard-coded a dev-only
      # Linux target-dir that silently redirected every build, CI
      # included — that file is now gitignored instead of committed.
      # Both candidate paths stay here anyway, as a no-cost safety net.
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: clavium-windows-installer
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
